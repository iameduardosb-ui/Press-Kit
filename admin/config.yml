backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

locale: "es"

collections:
  - name: "site"
    label: "Contenido del sitio"
    files:
      - file: "content.json"
        label: "Página completa"
        name: "content"
        fields:
          - label: "Apariencia y secciones"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Color de acento", name: "accent_color", widget: "color", hint: "El color de detalles, botones y títulos destacados" }
              - { label: "Color de fondo", name: "bg_color", widget: "color", hint: "Usa un tono oscuro para que el texto siga siendo legible" }
              - label: "Ocultar secciones"
                name: "hidden_sections"
                widget: "object"
                hint: "Activa el interruptor SOLO de las secciones que quieras ocultar. Lo que dejes apagado se muestra. Lo que ocultes no se borra."
                fields:
                  - { label: "Ocultar Biografía", name: "bio", widget: "boolean", default: false, required: false }
                  - { label: "Ocultar Fotos", name: "fotos", widget: "boolean", default: false, required: false }
                  - { label: "Ocultar Videos", name: "videos", widget: "boolean", default: false, required: false }
                  - { label: "Ocultar Mixes", name: "mixes", widget: "boolean", default: false, required: false }
                  - { label: "Ocultar Eventos", name: "eventos", widget: "boolean", default: false, required: false }
                  - { label: "Ocultar Discografía", name: "discografia", widget: "boolean", default: false, required: false }
                  - { label: "Ocultar Prensa", name: "prensa", widget: "boolean", default: false, required: false }
                  - { label: "Ocultar Booking", name: "booking", widget: "boolean", default: false, required: false }

          - label: "Hero (portada)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto previo (ej. Press Kit —)", name: "kicker_prefix", widget: "string" }
              - label: "Géneros (clicables, cada uno con su BPM)"
                name: "genres"
                widget: "list"
                hint: "El primero de la lista es el que se muestra al cargar la página. Agrega o quita los que quieras."
                fields:
                  - { label: "Nombre del género", name: "name", widget: "string" }
                  - { label: "Rango de BPM", name: "bpm", widget: "string", hint: "ej. 135 - 145 BPM" }
              - { label: "Título línea 1 (ej. DJ)", name: "title_line1", widget: "string" }
              - { label: "Título línea 2 (tu nombre)", name: "title_line2", widget: "string" }
              - { label: "Frase / tagline", name: "tagline", widget: "text" }
              - label: "Estadísticas rápidas"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Valor", name: "value", widget: "string" }
                  - { label: "Etiqueta", name: "label", widget: "string" }

          - label: "Biografía"
            name: "bio"
            widget: "object"
            fields:
              - { label: "Foto principal", name: "photo", widget: "image", required: false }
              - label: "Párrafos"
                name: "paragraphs"
                widget: "list"
                field: { label: "Párrafo", name: "text", widget: "text" }
              - label: "Estadísticas"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Valor", name: "value", widget: "string" }
                  - { label: "Etiqueta", name: "label", widget: "string" }

          - label: "Galería de fotos"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Descripción", name: "alt", widget: "string" }

          - label: "Videos"
            name: "videos"
            widget: "list"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Año", name: "year", widget: "string" }
              - { label: "Link del video", name: "url", widget: "string", required: false, hint: "Pega la URL del video: YouTube, Vimeo, o cualquier link de embed directo" }

          - label: "Mixes (audio)"
            name: "tracks"
            widget: "list"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Etiqueta (ej. Original Mix)", name: "tag", widget: "string" }
              - { label: "Duración (ej. 6:32)", name: "dur", widget: "string" }
              - { label: "Link del mix", name: "url", widget: "string", required: false, hint: "Pega el link de SoundCloud, YouTube, o la URL directa de un mp3" }

          - label: "Eventos (próximos y pasados)"
            name: "events"
            widget: "list"
            hint: "Agrega cada evento con su fecha. La página los separa sola en 'Próximos' y 'Pasados' según la fecha de hoy."
            fields:
              - { label: "Nombre del evento", name: "name", widget: "string" }
              - { label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: false }
              - { label: "Lugar / club", name: "venue", widget: "string", required: false }
              - { label: "Ciudad", name: "city", widget: "string", required: false }
              - { label: "Enlace (entradas o info)", name: "url", widget: "string", required: false, hint: "Opcional. Si lo dejas vacío, el evento se muestra sin botón." }
              - { label: "Flyer / afiche", name: "flyer", widget: "image", required: false }

          - label: "Discografía"
            name: "releases"
            widget: "list"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Sello", name: "label_name", widget: "string" }
              - { label: "Año", name: "year", widget: "string" }
              - { label: "Enlace (Bandcamp / Beatport / Spotify)", name: "url", widget: "string" }
              - { label: "Portada", name: "image", widget: "image", required: false }

          - label: "Prensa"
            name: "press"
            widget: "object"
            fields:
              - { label: "Cita destacada", name: "quote", widget: "text" }
              - { label: "Fuente de la cita", name: "source", widget: "string" }
              - label: "Logos de medios"
                name: "logos"
                widget: "list"
                fields:
                  - { label: "Logo", name: "image", widget: "image", required: false }
                  - { label: "Nombre del medio", name: "alt", widget: "string" }

          - label: "Booking"
            name: "booking"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - label: "Enlaces (redes, plataformas, lo que quieras)"
                name: "links"
                widget: "list"
                hint: "Agrega tantos como quieras: Instagram, SoundCloud, WhatsApp, Beatport, TikTok, tu web, etc."
                fields:
                  - { label: "Nombre (ej. Instagram)", name: "label", widget: "string" }
                  - { label: "Texto a mostrar (ej. @tuusuario)", name: "display", widget: "string", required: false, hint: "Si lo dejas vacío, se muestra el enlace completo" }
                  - { label: "Enlace completo (URL)", name: "url", widget: "string", hint: "Para WhatsApp usa el formato https://wa.me/57XXXXXXXXXX" }
              - { label: "Texto del rider técnico", name: "rider_text", widget: "text" }
              - { label: "PDF del rider", name: "rider_pdf", widget: "file", required: false }

          - label: "Textos de la página (títulos e introducciones)"
            name: "copy"
            widget: "object"
            hint: "Todos opcionales: si dejas uno vacío, la página usa el texto por defecto."
            fields:
              - { label: "Título de la biografía", name: "bio_heading", widget: "string", required: false }
              - { label: "Introducción — Fotos", name: "gallery_intro", widget: "text", required: false }
              - { label: "Introducción — Videos", name: "videos_intro", widget: "text", required: false }
              - { label: "Introducción — Mixes", name: "mixes_intro", widget: "text", required: false }
              - { label: "Introducción — Eventos", name: "events_intro", widget: "text", required: false }
              - { label: "Introducción — Discografía", name: "discografia_intro", widget: "text", required: false }
              - { label: "Introducción — Booking", name: "booking_intro", widget: "text", required: false }

          - label: "Pie de página"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Texto principal (ej. © 2026 Tu Nombre...)", name: "text", widget: "string" }
              - { label: "Nota a la derecha (ej. Press kit construido a mano...)", name: "note", widget: "string", required: false }
